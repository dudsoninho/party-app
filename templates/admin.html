<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Administratora - MotylCoin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container my-4">
        
        <!-- NAGŁÓWEK I POWROT -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>⚙️ Panel Administratora</h2>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary"><i class="fa-solid fa-arrow-left me-2"></i>Powrót do aplikacji</a>
        </div>

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="Tak, to jest fragment kodu Twojego szablonu w formacie Jinja2/HTML (`templates/admin.html`), choć wygląda na to, że przy wklejaniu mogła uciec część znaczników HTML (widoczne są tagi logiki jak `{% ... %}` oraz zmienne `{{ ... }}`, ale brakuje struktury znaczników takich jak `<div>`, `<h2>` itp.).

Możesz wkleić ten blok z szybkimi nagrodami (ten ze skryptem JavaScript) bezpośrednio **przed sekcją zarządzania użytkownikami** (`👥 Zarządzanie Użytkownikami`) lub na sam koniec pliku. 

Oto jak możesz bezpiecznie umieścić sekcję szybkich nagród w swoim pliku `admin.html`:

```html
<!-- Sekcja Szybkich Nagród Agendowych -->
<div class="card card-custom p-4 mb-4">
    <h4 class="fw-bold mb-3"><i class="fa-solid fa-bolt text-warning me-2"></i>Szybkie Nagrody Agendowe</h4>
    <form action="{{ url_for('admin.quick_reward') }}" method="POST">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Wybierz Gracza:</label>
                <select name="user_id" class="form-select" required>
                    <option value="">-- Wybierz uczestnika --</option>
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }} (ID: {{ u.user_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Wybierz Nagrodę / Akcję:</label>
                <select name="title" id="reward-preset" class="form-select" onchange="updateRewardAmount(this)" required>
                    <option value="" data-amount="0">-- Wybierz osiągnięcie --</option>
                    <optgroup label="Kahoot">
                        <option value="Kahoot: 1. miejsce" data-amount="150">Kahoot: 1. miejsce (+150 MC)</option>
                        <option value="Kahoot: 2. miejsce" data-amount="100">Kahoot: 2. miejsce (+100 MC)</option>
                        <option value="Kahoot: 3. miejsce" data-amount="50">Kahoot: 3. miejsce (+50 MC)</option>
                        <option value="Kahoot: Udział" data-amount="20">Kahoot: Udział (+20 MC)</option>
                    </optgroup>
                    <optgroup label="Siatkówka">
                        <option value="Siatkówka: Wygrani" data-amount="50">Siatkówka: Wygrani (+50 MC)</option>
                        <option value="Siatkówka: MVP" data-amount="30">Siatkówka: MVP (+30 MC)</option>
                    </optgroup>
                    <optgroup label="Odznaki / Parkiet">
                        <option value="Odznaka: Pustynny Jastrząb" data-amount="30">Pustynny Jastrząb (+30 MC)</option>
                        <option value="Odznaka: Sommelier" data-amount="20">Sommelier (+20 MC)</option>
                        <option value="Odznaka: Parkietowy Banger" data-amount="30">Parkietowy Banger (+30 MC)</option>
                        <option value="Odznaka: Król Parkietu" data-amount="50">Król Parkietu (+50 MC)</option>
                    </optgroup>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Kwota (MC):</label>
                <input type="number" id="reward-amount" name="amount" class="form-control" placeholder="MC" required>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100 fw-bold" title="Przyznaj"><i class="fa-solid fa-check"></i></button>
            </div>
        </div>
    </form>
</div>

<script>
function updateRewardAmount(select) {
    const selectedOption = select.options[select.selectedIndex];
    const amount = selectedOption.getAttribute('data-amount');
    document.getElementById('reward-amount').value = amount;
}
</script>
