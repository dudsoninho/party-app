{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="header">
        <h2>Cześć, {{ user.username }}!</h2>
        <a href="{{ url_for('main.logout') }}" class="btn-logout">Wyloguj</a>
    </div>
    <div class="balance-box">
        <span>Twoje Monety:</span>
        <h1 id="user-balance">{{ user.balance }}</h1>
    </div>

    {% if user.is_admin %}
    <div class="admin-link">
        <a href="{{ url_for('main.admin') }}" class="btn-admin">Panel Admina</a>
    </div>
    {% endif %}

    <h3>Przekaż monety</h3>
    <div class="user-list">
        {% for u in users %}
        <div class="user-item">
            <span>{{ u.username }}</span>
            <div class="transfer-form">
                <input type="number" id="amount-{{ u.id }}" min="1" value="5">
                <button onclick="sendCoins({{ u.id }}, '{{ u.username }}')">Wyślij</button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
