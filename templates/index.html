{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 50px auto; padding: 30px; background: #181824; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
    <h2 style="color: #fff; margin-bottom: 10px;">Cześć, {{ username }}!</h2>
    <p style="color: #a0a0b0; margin-bottom: 20px;">Witaj w aplikacji Party Coin.</p>
    <a href="{{ url_for('logout') }}" class="btn" style="display: inline-block; padding: 10px 20px; background: #ff007f; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold;">Wyloguj się</a>
</div>
{% endblock %}
