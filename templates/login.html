{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 100px auto; padding: 30px; background: #181824; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
    <h2 style="text-align: center; color: #fff; margin-bottom: 20px;">Wejdź do gry</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 20px;">
            <label for="username" style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: #a0a0b0;">Twój nick</label>
            <input type="text" id="username" name="username" required placeholder="Wpisz swój nick..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a3a; background: #121218; color: #fff; box-sizing: border-box;">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%); color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem;">Graj!</button>
    </form>
</div>
{% endblock %}
