{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Zaloguj się</h2>
    <form id="login-form" method="POST" action="{{ url_for('login') }}">
        <div>
            <label for="username">Nazwa użytkownika</label>
            <input type="text" id="username" name="username" required placeholder="Wpisz swój nick...">
        </div>
        <button type="submit" class="btn">Wejdź do gry</button>
    </form>
    <p style="margin-top: 15px; text-align: center; font-size: 0.9rem; color: #a0a0b0;">
        Nie masz konta? <a href="{{ url_for('register') }}" style="color: #00dfd8;">Zarejestruj się</a>
    </p>
</div>
{% endblock %}
