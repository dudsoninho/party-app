{% extends "base.html" %}

{% block content %}
<style>
    /* Pełnoekranowe tło ze zdjęciem */
    body {
        background: url("{{ url_for('static', filename='bg-login.png') }}") no-repeat center center fixed !important;
        background-size: cover !important;
    }

    /* Półprzezroczysta karta z efektem szkła (Glassmorphism) */
    .glass-card {
        background: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid var(--motyl-border-gold);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    .form-control:focus {
        border-color: var(--motyl-copper);
        box-shadow: 0 0 0 0.25rem rgba(162, 71, 49, 0.25);
    }
</style>

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card glass-card p-4 p-md-5 w-100" style="max-width: 440px;">
        
        <div class="text-center mb-4">
            <h2 class="mb-1" style="color: var(--motyl-copper);">Wejdź do gry</h2>
            <p class="sub-header small mb-0">Wpisz swój nick, PIN i ustaw swój avatar</p>
        </div>

        <!-- DODANO: enctype="multipart/form-data" dla obsługi plików -->
        <form method="POST" enctype="multipart/form-data">
            
            <!-- POLE: NICK -->
            <div class="mb-3">
                <label for="nick" class="form-label fw-bold">Twój nick</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-user" style="color: var(--motyl-copper);"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0" id="nick" name="nick" placeholder="Wpisz swój nick..." required autofocus>
                </div>
            </div>

            <!-- POLE: PIN -->
            <div class="mb-3">
                <label for="pin" class="form-label fw-bold">4-cyfrowy PIN</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-key" style="color: var(--motyl-copper);"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 ps-0" id="pin" name="pin" maxlength="4" pattern="[0-9]{4}" placeholder="np. 1234" required>
                </div>
            </div>

            <!-- POLE: AVATAR (ZDJĘCIE) -->
            <div class="mb-4">
                <label for="avatar" class="form-label fw-bold">Zdjęcie profilowe <span class="fw-normal text-muted">(opcjonalnie)</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-camera" style="color: var(--motyl-copper);"></i>
                    </span>
                    <input type="file" class="form-control border-start-0 ps-0" id="avatar" name="avatar" accept="image/*">
                </div>
            </div>

            <!-- PRZYCISK -->
            <button type="submit" class="btn btn-motyl-primary w-100 py-2.5 fw-bold shadow-sm">
                <i class="fa-solid fa-gamepad me-2"></i> Graj!
            </button>
        </form>

    </div>
</div>
{% endblock %}
